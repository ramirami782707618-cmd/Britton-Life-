خ<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRITTON LIFE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <a class="brand" href="#">
        ♡ BRITTON LIFE
    </a>
</header>

<div class="layout">

    <!-- القائمة الجانبية -->
    <aside class="panel side">
        <h3>جميع الأقسام</h3>
        <p>الألعاب الزوجية</p>
        <p>إكسسوارات وملحقات</p>
        <p>مستلزمات رومانسية</p>
        <p>الكتب والإرشادات</p>
        <p>العروض والخصومات</p>
    </aside>


    <!-- الصفحة الرئيسية -->
    <main>

        <section class="hero panel">
            <h1>BRITTON LIFE</h1>
            <p>حياة أكثر من مجرد لعبة</p>
            <button>تسوق الآن</button>
        </section>


        <section class="products panel" id="products">
            <h2>المنتجات</h2>

            <div class="product">
                <h3>منتج تجريبي</h3>
                <p>السعر 249 ر.س</p>
                <button>أضف للسلة</button>
            </div>

        </section>

    </main>


    <!-- الجانب الأيمن -->
    <aside class="panel right">
        <h3>سلة التسوق</h3>
        <p>لا توجد منتجات</p>
    </aside>

</div>


<script src="app.js"></script>

</body>
</html>
